<!-- modify-student.component.html -->
<form [formGroup]="courseForm" (ngSubmit)="onSubmit()">
  <!-- ID Field -->
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <div class="form-group">
    <label for="subjectCode">Subject code</label>
    <input type="text" id="subjectCode" formControlName="subjectCode" />
  </div>

  <div class="form-group">
    <label for="instructorName">Instructor Name</label>
    <input type="text" id="instructorName" formControlName="instructorName" appAutoFocus/>
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input type="text" id="email" formControlName="email" />
  </div>

  <div class="form-group">
    <label for="marks">Marks</label>
    <input type="text" id="marks" formControlName="marks" />
  </div>

  <div class="form-group">
    <label for="imageURL">Image Link</label>
    <input type="text" id="imageURL" formControlName="imageURL" />
  </div>

  <!-- Is Admin Checkbox -->
  <div class="form-group">
    <label for="isAdmin">Is Admin</label>
    <input type="checkbox" id="isAdmin" formControlName="isAdmin" />
  </div>

  <!-- Submit Button (Add or Update) -->
  <button type="submit">Submit</button>

  <!-- Delete Button (Always Displayed Now) -->
  <button type="button" (click)="onDelete()">Delete</button>

  <!-- Back Button -->
  <button type="button" (click)="navigateToStudentList()">Back to List</button>
</form>
